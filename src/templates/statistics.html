<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tomato Detection Stream</title>
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1>Tomato Detection Statistics</h1>
        <button class="logoutButton" onClick="window.location.href = '/api/logout'" style="width:auto;">Logout</button>
    </header>

    <nav>
        <ul class="navBar">
            <li><a href="index.html">Home Page</a></li>
            <li><a href="historical_images.html">Historical Images</a></li>
            <li><a href="notifications.html">Notifications</a></li>
            <li><a href="statistics.html">Statistics Dashboard</a></li>
        </ul>
    </nav>

    <main>
        <div id="login_popup" class="modal">
            <!--Login popup is inserted here-->
        </div>

        <h2>Detection Statistics</h2>
        <div class="stats-container">
            <div class="tomato-statistics">
                <p>Total Images Processed: <span id="totalImages">Loading...</span></p>
                <p>Detections Made: <span id="detectionsCount">Loading...</span></p>
            </div>
            
        </div>
        <div class="stats-container">
            <canvas id="detectionChart"></canvas>
        </div>
        <div class="stats-container">
            <canvas id="detectionClassChart"></canvas>
        </div>
        <div class="stats-container">
            <canvas id="barChart"></canvas>
        </div>
    </main>

    <footer>

    </footer>

</body>
<script>
    window.statisticsData = {{ statistics_data | tojson | safe }};
</script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0"></script> <!-- Include Chart.js library -->
<script type="module" src="/static/statistics.js"></script>
</html>
